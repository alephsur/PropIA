[project]
name = "propia"
version = "3.0.0"
description = "Sistema de Automatización Inmobiliaria · Cantabria & Asturias"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.0",
    "anthropic==0.36.0",
    "openai==1.56.0",
    "voyageai==0.3.2",
    "pdfplumber==0.11.4",
    "pymupdf==1.24.12",
    "pytesseract==0.3.13",
    "lxml==5.3.0",
    "beautifulsoup4==4.12.3",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.5",
    "slowapi==0.1.9",
    "pydantic-settings==2.6.0",
    "python-multipart==0.0.12",
    "aiofiles==24.1.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (manejado por formatter)
    "B008", # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
